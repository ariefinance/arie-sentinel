[project]
name = "arie-sentinel-api"
version = "0.1.0"
description = "ARIE Sentinel — Phase 1 Counterparty Integrity Engine (backend API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arie_sentinel"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"
# Autogenerated Alembic migrations are not hand-maintained style-wise.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# UP042: we intentionally use `str, enum.Enum` (broad compatibility with SQLAlchemy
#   Enum handling) rather than enum.StrEnum.
# B008: FastAPI's `Depends(...)` in argument defaults is the framework idiom.
ignore = ["UP042", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
