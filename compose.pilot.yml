services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside Git}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sentinel-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build: ./apps/api
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./apps/api
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  worker:
    build: ./apps/api
    command: ["uv", "run", "--no-sync", "python", "-m", "arie_sentinel.jobs.worker"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./apps/web
    environment:
      API_UPSTREAM: http://api:8000
      BASIC_AUTH_HTPASSWD: "${BASIC_AUTH_HTPASSWD:?set BASIC_AUTH_HTPASSWD outside Git}"
    ports:
      - "${SENTINEL_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sentinel-postgres:
